
<header id="Banner">
    <div class="banner_inner">
        <a id="page_title" href="/index.html">Scott Stack</a>
        <object data="/main_circuit.svg" type="image/svg+xml" id="svg_circuit" aria-label="Circuit board graphic. Drag the red, green and blue knobs to change the colour of the name."></object>
    </div>

    <script type="text/javascript">
        // Scale the fixed-size circuit board graphic to fit the screen. On phones it
        // stops shrinking at 55% so the name stays readable, and the right side is cropped.
        (function () {
            var BOARD_W = 1220, BOARD_H = 200, MIN_SCALE = 0.55;
            function fitBanner() {
                var banner = document.getElementById("Banner");
                var inner = banner.querySelector(".banner_inner");
                var width = banner.clientWidth;
                var scale = Math.max(MIN_SCALE, Math.min(1, width / BOARD_W));
                var offset = Math.max(0, (width - BOARD_W * scale) / 2);
                inner.style.transform = "translateX(" + offset + "px) scale(" + scale + ")";
                banner.style.height = (BOARD_H * scale) + "px";
            }
            fitBanner();
            window.addEventListener("resize", fitBanner);
        })();

        // RGB knobs: grab a knob, move the mouse up/down to set that colour of the name.
        // Drag-and-release works, and so does click once to grab, click again to let go.
        (function () {
            var BOARD_H = 200;
            var colors = { red: 255, green: 255, blue: 255 };
            var pivots = { red: 902, green: 982, blue: 1062 };   // knob centres in the SVG
            var pots = {};
            var active = null, dragged = false, startY = 0, wired = false;

            var title = document.getElementById("page_title");
            var svgElm = document.getElementById("svg_circuit");
            var inner = svgElm.parentNode;

            function setColor(name, value) {
                colors[name] = Math.max(0, Math.min(255, value));
                pots[name].setAttribute("transform", "rotate(" + (360 / 255 * colors[name]) + " " + pivots[name] + " 72)");
                title.style.color = "rgb(" + Math.floor(colors.red) + "," + Math.floor(colors.green) + "," + Math.floor(colors.blue) + ")";
            }

            // y is in board coordinates (0 at the top of the board, 200 at the bottom)
            function track(y) {
                if (!active) return;
                if (Math.abs(y - startY) > 3) dragged = true;
                setColor(active, 255 / BOARD_H * y);
            }

            function onMouseUp() {
                if (active && dragged) active = null;
            }

            // Hook up the knobs once the SVG document is available. Called both on the
            // load event and straight away, because a cached SVG can finish loading
            // before this script runs, and then the load event is never seen.
            function wireKnobs() {
                var svgDoc = svgElm.contentDocument;
                if (wired || !svgDoc || !svgDoc.getElementById("red_pot")) return;
                wired = true;

                ["red", "green", "blue"].forEach(function (name) {
                    var pot = svgDoc.getElementById(name + "_pot");
                    pots[name] = pot;
                    pot.style.cursor = "grab";
                    pot.addEventListener("mousedown", function (evt) {
                        evt.preventDefault();
                        evt.stopPropagation();
                        if (active === name) { active = null; return; }
                        active = name;
                        dragged = false;
                        startY = evt.clientY;
                    });
                });

                svgDoc.addEventListener("mousemove", function (evt) { track(evt.clientY); });
                svgDoc.addEventListener("mouseup", onMouseUp);
                // clicking anywhere else on the board lets go of the knob
                svgDoc.addEventListener("mousedown", function () { active = null; });
            }

            // keep tracking when the mouse leaves the board while a knob is held
            window.addEventListener("mousemove", function (evt) {
                if (!active) return;
                var rect = inner.getBoundingClientRect();
                track((evt.clientY - rect.top) / (rect.height / BOARD_H));
            });
            window.addEventListener("mouseup", onMouseUp);

            svgElm.addEventListener("load", wireKnobs);
            wireKnobs();
        })();
    </script>
</header>


<nav class="navbar" aria-label="Main">
    <ul class="navbar_list">
        <li class="navbar_entry">
            <a href="/index.html"{% if page.url == "/" or page.url == "/index.html" %} class="active" aria-current="page"{% endif %}>Home</a>
        </li>
        <li class="navbar_entry has_menu">
            <a href="/projects.html"{% if page.url contains "projects" %} class="active"{% endif %}>Projects</a>
            <ul class="submenu">
                {% for p in site.data.projects limit:5 %}
                <li class="submenu_item"><a href="/{{ p.url }}">{{ p.title }}</a></li>
                {% endfor %}
                <li class="submenu_item submenu_all"><a href="/projects.html">All projects</a></li>
            </ul>
        </li>
        <li class="navbar_entry navbar_right">
            <a href="https://github.com/spstack">GitHub</a>
        </li>
    </ul>
</nav>
